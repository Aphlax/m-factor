<!DOCTYPE html>
<html lang="en" style="width: 100%; height: 100%; margin: 0; overflow: hidden;">
  <head>
    <script type="importmap">{"imports": {
    "react": "https://esm.sh/stable/react@19.2.0",
    "react-dom/client": "https://esm.sh/stable/react-dom@19.2.0/client"}}
    </script>
  </head>
  <body style="width: calc(100% - 20px); height: calc(100% - 20px); margin: 10px; overflow: hidden; touch-action: none;">
    <h2>Belt Test</h2>
    <div id="root" style="width: calc(100% - 20px); height: calc(100% - 20px); margin: 0; overflow: auto;"></div>
<script type="module">
import {it, sit, fit, test, assertEqual, assertNotEqual, assertExists, assertNotExists, assertMatch, blueprint, blueprintScrambled, elapse} from './test-framework.js';
import {DIRECTION, NAME} from '../entity-properties.js';
const north = {direction: DIRECTION.north},
    east = {direction: DIRECTION.east},
    south = {direction: DIRECTION.south},
    west = {direction: DIRECTION.west};

it("creates belt", () => {
  const name = NAME.transportBelt;
  blueprint([
    {name, x: 0, y: 0, ...north},
  ], ([b1], map) => {
    assertExists(b1);
    assertExists(b1.data.lane);
    assertEqual(map.getEntityAt(0, 0), b1);
    assertMatch(map.getEntitiesIn(0, 0, 1, 1),
        [b1]);
    assertMatch(map.getEntitiesIn(1, 0, 1, 1),
        []);
  });
});
it("splits lane with chunk border", () => {
  const name = NAME.transportBelt;
  blueprintScrambled([
    {name, x: 0, y: -1, ...north},
    {name, x: 0, y: 0, ...north},
    {name, x: 0, y: 1, ...north},
  ], ([b1, b2, b3], map) => {
    assertExists(b1.data.lane);
    assertEqual(b1.data.lane, b3.data.lane);
    map.deleteEntity(b2, 0);
    assertNotEqual(b1.data.lane, b3.data.lane);
    assertNotExists(map.getEntityAt(0, 0));
  });
});
it("T junction behaves correctly", () => {
  const name = NAME.transportBelt;
  blueprintScrambled([
    {name, x: 0, y: 0, ...north},
    {name, x: -1, y: 0, ...east},
    {name, x: 1, y: 0, ...west},
  ], ([b1, b2, b3], map) => {
    assertNotEqual(b1.data.lane, b2.data.lane);
    assertNotEqual(b1.data.lane, b3.data.lane);
    map.deleteEntity(b2, 0);
    assertEqual(b1.data.lane, b3.data.lane);
    assertMatch(b1.data.lane.nodes,
        [{length: 1}, {length: 1}]);
  });
});
it("X junction behaves correctly", () => {
  const name = NAME.transportBelt;
  blueprintScrambled([
    {name, x: 0, y: 0, ...north},
    {name, x: 0, y: 1, ...north},
    {name, x: -1, y: 0, ...east},
    {name, x: 1, y: 0, ...west},
  ], ([b1, b2, b3, b4], map) => {
    assertEqual(b1.data.lane, b2.data.lane);
    assertNotEqual(b1.data.lane, b3.data.lane);
    assertNotEqual(b1.data.lane, b4.data.lane);
    map.deleteEntity(b3, 0);
    assertNotEqual(b1.data.lane, b4.data.lane);
    map.deleteEntity(b2, 0);
    assertEqual(b1.data.lane, b4.data.lane);
  });
});
it("loop behaves correctly", () => {
  const name = NAME.transportBelt;
  blueprintScrambled([
    {name, x: 0, y: 0, ...east},
    {name, x: 0, y: 1, ...north},
    {name, x: 1, y: 1, ...west},
    {name, x: 1, y: 0, ...south},
  ], ([b1, b2, b3, b4], map, r) => {
    assertExists(b1.data.lane);
    assertEqual(b1.data.lane, b2.data.lane);
    assertEqual(b1.data.lane, b3.data.lane);
    assertEqual(b1.data.lane, b4.data.lane);
    assertEqual(b1.data.lane.circular, true);
    const b5 = map.createEntity(
        r({name, x: 1, y: -1, ...south}));
    assertEqual(b1.data.lane.circular, false);
    map.deleteEntity(b5, 0);
    assertEqual(b1.data.lane.circular, true);
    map.deleteEntity(b1, 0);
    assertEqual(b2.data.lane.circular, false);
  });
});
it("connects underground", () => {
  const belt = NAME.transportBelt;
  const name = NAME.undergroundBelt;
  blueprintScrambled([
    {name: belt, x: 0, y: -1, ...north},
    {name, x: 0, y: 0, ...north, data: {undergroundUp: true}},
    {name, x: 0, y: 5, ...north, data: {undergroundUp: false}},
    {name: belt, x: 0, y: 6, ...north},
  ], ([b1, u1, u2, b2]) => {
    assertEqual(u1.data.beltInput, u2);
    assertExists(u1.data.lane);
    assertEqual(u1.data.lane, u2.data.lane);
    assertMatch(u1.data.lane.nodes,
        [{length: 8}]);
  });
});
it("picks correct underground connection", () => {
  const name = NAME.undergroundBelt;
  blueprintScrambled([
    {name, x: 0, y: 0, ...north, data: {undergroundUp: true}},
    {name, x: 0, y: 1, ...north, data: {undergroundUp: true}},
    {name, x: 0, y: 3, ...north, data: {undergroundUp: false}},
    {name, x: 0, y: 4, ...north, data: {undergroundUp: false}},
  ], ([u1, u2, u3, u4], map) => {
    assertEqual(u2.data.beltInput, u3);
    assertEqual(u2.data.lane, u3.data.lane);
    assertNotEqual(u1.data.lane, u2.data.lane);
    assertNotEqual(u4.data.lane, u2.data.lane);
    map.deleteEntity(u3, 0);
    assertEqual(u2.data.lane, u4.data.lane);
    map.deleteEntity(u2, 0);
    assertEqual(u1.data.lane, u4.data.lane);
    assertMatch(u1.data.lane.nodes,
        [{length: 5}]);
  });
});
it("considers underground gaps", () => {
  const name = NAME.undergroundBelt;
  blueprintScrambled([
    {name, x: 0, y: 0, ...north, data: {undergroundUp: true}},
    {name, x: 0, y: 2, ...north, data: {undergroundUp: false}},
    {name, x: 0, y: 3, ...north, data: {undergroundUp: true}},
    {name, x: 0, y: 5, ...north, data: {undergroundUp: false}},
  ], ([u1, u2, u3, u4], map, r) => {
    assertEqual(u1.data.lane, u2.data.lane);
    assertEqual(u1.data.lane, u4.data.lane);
    assertMatch(u1.data.lane.nodes,
        [{length: 6, gaps: [0, 2, 3, 2]}]);
    map.deleteEntity(u4, 0);
    assertMatch(u1.data.lane.nodes,
        [{length: 4, gaps: [1, 2]}]);
    u4 = map.createEntity(
        r({name, x: 0, y: 5, ...north, data: {undergroundUp: false}}));
    assertMatch(u1.data.lane.nodes,
        [{length: 6, gaps: [0, 2, 3, 2]}]);
    map.deleteEntity(u3, 0);
    assertMatch(u1.data.lane.nodes,
        [{length: 3, gaps: [0, 2]}]);
  });
});
it("considers underground items", () => {
  const belt = NAME.transportBelt;
  const name = NAME.undergroundBelt;
  blueprintScrambled([
    {name, x: 0, y: 0, ...north, data: {undergroundUp: true}},
    {name: belt, x: 0, y: 1, ...north},
    {name, x: 0, y: 2, ...north, data: {undergroundUp: false}},
    {name: belt, x: 0, y: 3, ...north},
    {name: belt, x: 0, y: -1, ...north},
  ], ([u1, b1, u2, b2, b3], map, r) => {
    assertMatch(u1.data.lane.nodes,
        [{length: 5, gaps: [1, 2]}]);
    u1.data.lane.minusFlow.push(...new Array(20).fill([0, 1]).flat());
    map.deleteEntity(u1, 0);
    assertMatch(b2.data.lane.minusFlow,
        {length: 16});
    assertMatch(b3.data.lane.minusFlow,
        new Array(4).fill([0, 1]).flat());
    u1 = map.createEntity(
        r({name, x: 0, y: 0, ...north, data: {undergroundUp: true}}));
    assertMatch(u1.data.lane.minusFlow
        .filter((_, i) => !(i % 2)),
        [0,0,0,0,2,0,0,0,0,0,0,0]);
    u1.data.lane.minusFlow.length = 0;
    u1.data.lane.minusFlow.push(...new Array(20).fill([0, 1]).flat());
    map.deleteEntity(u2, 0);
    u2 = map.createEntity(
        r({name, x: 0, y: 2, ...north, data: {undergroundUp: false}}));
    assertMatch(u1.data.lane.minusFlow
        .filter((_, i) => !(i % 2)),
        [0,0,0,0,0,0,0,0,2,0,0,0]);
  });
});
it("connects splitter", () => {
  const name = NAME.transportBelt;
  const splitter = NAME.splitter;
  blueprintScrambled([
    {name: splitter, x: 0, y: 0, ...north},
    {name, x: 0, y: -1, ...north},
    {name, x: 1, y: -1, ...north},
    {name, x: 0, y: 1, ...north},
    {name, x: 1, y: 1, ...north},
  ], ([s1, b1, b2, b3, b4], map, r) => {
    assertEqual(s1.outputEntities.includes(b1), true);
    assertEqual(s1.data.leftBeltOutput, b1);
    assertExists(s1.data.leftInLane);
    assertEqual(s1.data.leftOutLane, b1.data.lane);
    assertEqual(s1.data.rightOutLane, b2.data.lane);
    assertEqual(s1.data.leftInLane, b3.data.lane);
    assertEqual(s1.data.rightInLane, b4.data.lane);
  });
});
it("connects circular splitter", () => {
  const name = NAME.transportBelt;
  const splitter = NAME.splitter;
  blueprint([
    {name: splitter, x: 0, y: 0, ...north},
    {name, x: 0, y: -1, ...west},
    {name, x: -1, y: -1, ...south},
    {name, x: -1, y: 0, ...south},
    {name, x: -1, y: 1, ...east},
    {name, x: 0, y: 1, ...north},
  ], ([s1, b1, b2, b3, b4, b5], map, r) => {
    assertEqual(b1.data.beltInput, s1);
    assertEqual(b5.data.beltOutput, s1);
    assertEqual(b1.data.lane, b5.data.lane);
    assertEqual(s1.data.leftOutLane, s1.data.leftInLane);
    assertEqual(b1.data.lane.endSplitterData, s1.data);
    assertEqual(b1.data.lane.circular, false);
    map.deleteEntity(b5);
    assertNotEqual(s1.data.leftOutLane, s1.data.leftInLane);
    assertEqual(s1.data.leftBeltInput);
    assertEqual(b4.data.beltOutput);
    assertMatch(s1.data.leftInLane,
        {belts: [s1], nodes:[{length: 1}]});
    assertEqual(s1.data.leftInLane.endSplitterData, s1.data);
    b5 = map.createEntity(
        r({name, x: 0, y: 1, ...north}));
    assertEqual(s1.data.leftBeltInput, b5);
    assertEqual(b1.data.lane, b5.data.lane);
    assertEqual(s1.data.leftOutLane, s1.data.leftInLane);
  });
});
it("connects two splitters", () => {
  const name = NAME.splitter;
  blueprintScrambled([
    {name, x: 0, y: 0, ...north},
    {name, x: 0, y: -1, ...north},
  ], ([s1, s2], map, r) => {
    assertEqual(s1.data.leftOutLane, s2.data.leftInLane);
    assertEqual(s1.data.rightOutLane, s2.data.rightInLane);
    map.deleteEntity(s2);
    s2 = map.createEntity(
        r({name, x: 1, y: -1, ...north}));
    assertEqual(s1.data.rightOutLane, s2.data.leftInLane);
  });
});
it("insert to splitter", () => {
  const belt = NAME.transportBelt;
  const splitter = NAME.splitter;
  blueprint([
    {name: splitter, x: 0, y: 0, ...north},
    {name: belt, x: 0, y: 1, ...north},
    {name: belt, x: 0, y: 2, ...north},
  ], ([s1, b1], map) => {
    const lane = b1.data.lane;
    lane.insertItem(1, b1, 0, 4);
    assertMatch(lane.plusFlow, [1, 1]);
    lane.insertItem(1, s1, 0, 7);
    assertMatch(lane.minusFlow, [0.25, 1]);
    lane.insertItem(1, s1, 0, 1);
    assertMatch(lane.plusFlow, [0, 1, 0.75, 1]);
  });
});
it("extract from splitter", () => {
  const belt = NAME.transportBelt;
  const splitter = NAME.splitter;
  const inserter = NAME.inserter;
  const chest = NAME.woodenChest;
  blueprint([
    {name: splitter, x: 0, y: 0, ...north},
    {name: belt, x: 0, y: 1, ...north},
    {name: inserter, x: 1, y: 1, ...east},
    {name: chest, x: 2, y: 1, ...north},
    {name: splitter, x: 0, y: 2, ...north},
  ], ([s1, b1, i1, c1, s2], map) => {
    const lane = b1.data.lane;
    lane.minusFlow = [0.5, 1, 0.5, 1];
    let item = lane.extractItem(i1, b1, 0, 4);
    assertEqual(item, -1); // Negative item id.
    item = lane.extractItem(i1, b1, 0, 4);
    assertEqual(item, -1); // Negative item id.
    lane.minusFlow = [1.5, 1, 0, 1];
    item = lane.extractItem(i1, s2, 0, 4);
    assertEqual(item, -1); // Negative item id.
    item = lane.extractItem(i1, s2, 0, 4);
    assertEqual(item, -1); // Negative item id.
  });
});
it("extract from splitter long handed", () => {
  const splitter = NAME.splitter;
  const long = NAME.longHandedInserter;
  const short = NAME.inserter;
  const chest = NAME.woodenChest;
  blueprint([
    {name: splitter, x: 0, y: 0, ...north},
    {name: long, x: 2, y: 0, ...east},
    {name: chest, x: 4, y: 0, ...north},
    {name: splitter, x: 0, y: 2, ...north},
    {name: long, x: 2, y: 2, ...east},
    {name: chest, x: 4, y: 2, ...north},
    {name: splitter, x: 0, y: 4, ...north},
    {name: short, x: 2, y: 4, ...east},
    {name: chest, x: 3, y: 4, ...north},
  ], ([s1, l1, c1, s2, l2, c2, s3, l3, c3], map) => {
    const lane1 = s1.data.leftOutLane;
    lane1.minusFlow = [0, 1, 0, 1];
    const lane2 = s2.data.rightOutLane;
    lane2.minusFlow = [0, 1, 0, 1];
    const lane3 = s3.data.leftOutLane;
    lane3.minusFlow = [0, 1, 0, 1];
    elapse(map);
    assertEqual(l1.data.inserterItem, 1);
    assertEqual(l2.data.inserterItem, 0);
    assertEqual(l3.data.inserterItem, 0);
  });
});
it("splits items in splitter", () => {
  const splitter = NAME.splitter;
  blueprint([
    {name: splitter, x: 0, y: 0, ...north},
  ], ([s1], map) => {
    s1.data.leftInLane.minusFlow = [0, 1, 0, 1];
    elapse(map, 1);
    assertMatch(s1.data.leftOutLane.minusFlow, [0, 1]);
    assertMatch(s1.data.rightOutLane.minusFlow, [0, 1]);
  });
});
it("merges items in splitter", () => {
  const belt = NAME.transportBelt;
  const splitter = NAME.splitter;
  blueprint([
    {name: splitter, x: 0, y: 0, ...north},
    {name: belt, x: 0, y: -1, ...north},
  ], ([s1, b1], map) => {
    s1.data.leftInLane.minusFlow = [0, 1, 0, 1];
    s1.data.rightInLane.minusFlow = [0, 2, 0, 2];
    s1.data.rightOutLane.minusFlow = [0, 3, 0, 3, 0, 3];
    elapse(map, 1);
    assertMatch(s1.data.leftOutLane.minusFlow
        .filter((_, i) => i % 2),
        [1, 2, 1, 2]);
  });
});
it("moves items through congested splitter", () => {
  const splitter = NAME.splitter;
  blueprint([
    {name: splitter, x: 0, y: 0, ...north},
  ], ([s1], map) => {
    s1.data.leftInLane.minusFlow = [0, 1, 0, 1, 0, 1];
    s1.data.rightInLane.minusFlow = [0, 2, 0, 2, 0, 2];
    s1.data.leftOutLane.minusFlow = [0, 3];
    s1.data.rightOutLane.minusFlow = [0, 3];
    elapse(map, 2);
    assertMatch(s1.data.leftOutLane.minusFlow
        .filter((_, i) => i % 2),
        [3, 1, 1]);
    assertMatch(s1.data.rightOutLane.minusFlow
        .filter((_, i) => i % 2),
        [3, 2, 2]);
    assertMatch(s1.data.leftInLane.minusFlow
        .filter((_, i) => i % 2),
        [1]);
    assertMatch(s1.data.rightInLane.minusFlow
        .filter((_, i) => i % 2),
        [2]);
  });
});
it("sideloads from splitter", () => {
  const belt = NAME.transportBelt;
  const splitter = NAME.splitter;
  blueprintScrambled([
    {name: splitter, x: 0, y: 0, ...south},
    {name: belt, x: 1, y: 1, ...east},
    {name: belt, x: 1, y: 2, ...north},
    {name: belt, x: 0, y: 1, ...south},
  ], ([s1, b1, b2], map) => {
    s1.data.leftInLane.minusFlow = [0, 1, 0, 1];
    elapse(map, 2);
    assertMatch(b1.data.lane.minusFlow, [0, 1]);
  });
});
it("belt speed change", () => {
  const belt = NAME.transportBelt;
  const fast = NAME.fastTransportBelt;
  blueprintScrambled([
    {name: fast, x: 0, y: 0, ...south},
    {name: belt, x: 0, y: 1, ...south},
  ], ([b1, b2], map) => {
    assertEqual(b1.data.lane.nodes[0].length, 1);
    assertEqual(b2.data.lane.nodes[0].length, 1);
    b1.data.lane.minusFlow = [0.75, 1];
    elapse(map, 2);
    assertMatch(b2.data.lane.minusFlow, [0, 1]);
  });
});
it("splitter speed change", () => {
  const splitter = NAME.splitter;
  const belt = NAME.fastTransportBelt;
  blueprintScrambled([
    {name: belt, x: 0, y: 0, ...south},
    {name: belt, x: 1, y: 0, ...south},
    {name: splitter, x: 0, y: 1, ...south},
    {name: belt, x: 0, y: 2, ...south},
    {name: belt, x: 1, y: 2, ...south},
  ], ([b1, b2, s, b3, b4], map) => {
    assertEqual(b1.data.lane.nodes[0].length, 1);
    assertEqual(b3.data.lane.nodes[0].length, 1);
    b1.data.lane.minusFlow = [0.5, 1, 0, 1];
    elapse(map, 2);
    assertMatch(b3.data.lane.minusFlow, [0, 1]);
    assertMatch(b4.data.lane.minusFlow, [0, 1]);
    b2.data.lane.minusFlow = [0.5, 2, 0, 2];
    elapse(map, 2);
    assertMatch(b3.data.lane.minusFlow, [0, 1, 0, 2]);
    assertMatch(b4.data.lane.minusFlow, [0, 1, 0, 2]);
  });
});

test(document.getElementById("root"));
</script>
  </body>
</html>
