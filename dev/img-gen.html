<!DOCTYPE html>
<html lang="en" style="width: 100%; height: 100%; margin: 0; overflow: hidden;">
  <head>
    <meta charset="UTF-8">
    <title>img-gen</title>
    <meta name="description" content="test">
    <meta name="author" content="Fabian Meier">
    <script type="application/javascript">
window.onload = function() {
  const canvas = document.createElement("canvas");
  canvas.style.position = "absolute";
  canvas.style.top = "40px";
  canvas.style.left = "10px";
  canvas.style.padding = "4px";
  canvas.style.border = "1px solid grey";
  canvas.width = canvas.height =  40;
  const ctx = canvas.getContext('2d');
  
  //gear(ctx); // 32, 32
  //cross(ctx); // 32, 32
  //menu(ctx); // 32, 32
  //windUp(ctx); // 32, 32
  //copy(ctx); // 64, 64
  //snake(ctx); // 32, 32
  //undergroundConnect(ctx); // 32, 32
  //gridDrag(ctx); // 32, 32
  //paste(ctx); // 64, 64
  //tick(ctx); // 64, 64
  //move(ctx); // 32, 32
  //bulldoze(ctx); // 64, 64
  //chop(ctx); // 80, 80
  notImpl(ctx); // 40, 40
  
  // Open in web browser to download.
  let link = document.createElement('a');
  link.download = "notImpl" + ".png";
  link.href = canvas.toDataURL();
  link.style.position = "absolute";
  link.style.top = "10px";
  link.style.left = "10px";
  link.style["z-index"] = 1;
  link.innerText = "download " + link.download + "\n";
  document.body.appendChild(link);
  document.body.appendChild(canvas);
};

function notImpl(ctx) {
  ctx.beginPath();
  ctx.moveTo(20, 4);
  ctx.lineTo(38, 35);
  ctx.lineTo(2, 35);
  ctx.closePath();
  ctx.fillStyle = '#FFD800';
  ctx.fill();
  ctx.lineWidth = 4;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#FFD800';
  ctx.stroke();
  
  // stem
  ctx.beginPath();
  ctx.moveTo(20, 13);
  ctx.lineTo(20, 25);
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#1F2937';
  ctx.stroke();
  
  // dot
  ctx.beginPath();
  ctx.arc(20, 31, 2, 0, Math.PI * 2);
  ctx.fillStyle = '#1F2937';
  ctx.fill();
}

function chop(ctx) {
  const a = Math.PI * 2;
  ctx.fillStyle = "#000000";
  ctx.beginPath();
  const aa = a / 2 - a / 8;
  ctx.arc(24, 28, 18, aa - a / 8, aa + a / 8);
  ctx.arc(24, 28, 16, -a / 8 - a / 16, -a / 8 + a / 16);
  ctx.fill();
  
  ctx.strokeStyle = "#000000";
  ctx.lineWidth = 8;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(20, 20);
  ctx.lineTo(64, 64);
  ctx.stroke();
}

function bulldoze(ctx) {
  ctx.strokeStyle = "#FFFFFF";
  ctx.lineWidth = 5;
  ctx.setLineDash([4, 3]);
  ctx.beginPath();
  ctx.rect(9, 9, 40, 40, 6);
  ctx.stroke();
  
  ctx.strokeStyle = "#FF2222";
  ctx.lineWidth = 7;
  ctx.lineCap = "round";
  ctx.setLineDash([]);
  ctx.beginPath();
  ctx.moveTo(30, 30);
  ctx.lineTo(54, 54);
  ctx.moveTo(30, 54);
  ctx.lineTo(54, 30);
  ctx.stroke();
}

function move(ctx) {
  ctx.lineWidth = 3;
  ctx.lineCap = "round";
  ctx.strokeStyle = "#66AAFF";
  ctx.fillStyle = "#66AAFF";
  ctx.beginPath();
  ctx.moveTo(16, 9); ctx.lineTo(16, 5);
  ctx.moveTo(16, 23); ctx.lineTo(16, 27);
  ctx.moveTo(9, 16); ctx.lineTo(5, 16);
  ctx.moveTo(23, 16); ctx.lineTo(27, 16);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(16, 0); ctx.lineTo(11, 5);
  ctx.lineTo(21, 5); ctx.lineTo(16, 0);
  ctx.moveTo(16, 32); ctx.lineTo(11, 27);
  ctx.lineTo(21, 27); ctx.lineTo(16, 32);
  ctx.moveTo(0, 16); ctx.lineTo(5, 11);
  ctx.lineTo(5, 21); ctx.lineTo(0, 16);
  ctx.moveTo(32, 16); ctx.lineTo(27, 11);
  ctx.lineTo(27, 21); ctx.lineTo(32, 16);
  ctx.fill();
  
  ctx.beginPath();
  ctx.arc(16, 16, 3, 0, 7.4);
  ctx.fill();
}

function tick(ctx) {
  ctx.lineWidth = 8;
  ctx.strokeStyle = "#FFFFFF";
  ctx.beginPath();
  ctx.moveTo(8, 32);
  ctx.lineTo(24, 48);
  ctx.lineTo(56, 16);
  ctx.stroke();
}

function paste(ctx) {
  ctx.lineWidth = 8;
  ctx.strokeStyle = "#000000";
  
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(18, 38);
  ctx.lineTo(34, 38);
  ctx.moveTo(32, 30);
  ctx.lineTo(40, 38);
  ctx.lineTo(32, 46);
  ctx.stroke();
  
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, 64, 64);
  ctx.rect(0, 32, 50, 12);
  ctx.clip("evenodd");
  ctx.beginPath();
  ctx.roundRect(22, 20, 32, 36, 6);
  ctx.stroke();
  ctx.restore();
  
  ctx.beginPath();
  ctx.rect(0, 0, 64, 64);
  ctx.rect(22, 20, 32, 36);
  ctx.clip("evenodd");
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.rect(9, 9, 40, 40, 6);
  ctx.stroke();
}

function gridDrag(ctx) {
  ctx.lineWidth = 4;
  ctx.lineCap = "round";
  ctx.strokeStyle = "#00FF88";
  ctx.beginPath();
  ctx.moveTo(18, 28);
  ctx.lineTo(5, 28);
  ctx.lineTo(5, 4);
  ctx.lineTo(15, 4);
  ctx.moveTo(5, 16);
  ctx.lineTo(13, 16);
  ctx.moveTo(27, 4);
  ctx.lineTo(27, 28);
  ctx.stroke();
  ctx.fillStyle = "#00FF88";
  ctx.beginPath();
  ctx.arc(21, 4, 3, 0, 7.4);
  ctx.fill();
}

function undergroundConnect(ctx) {
  ctx.fillStyle = "#00FF8842";
  ctx.fillRect(12, 2, 8, 8);
  ctx.fillRect(12, 22, 8, 8);
  ctx.lineWidth = 2;
  ctx.strokeStyle = "#00FF88";
  ctx.strokeRect(12, 2, 8, 8);
  ctx.strokeRect(12, 22, 8, 8);
  ctx.beginPath();
  ctx.setLineDash([0, 2, 2, 1, 2, 1, 2, 1]);
  ctx.moveTo(12, 10);
  ctx.lineTo(12, 22);
  ctx.moveTo(20, 10);
  ctx.lineTo(20, 22);
  ctx.stroke();
}

function snake(ctx) {
  ctx.lineWidth = 4;
  ctx.lineCap = "round";
  ctx.strokeStyle = "#00FF88";
  ctx.beginPath();
  ctx.moveTo(7, 28);
  ctx.lineTo(24, 28);
  ctx.lineTo(24, 16);
  ctx.lineTo(8, 16);
  ctx.lineTo(8, 4);
  ctx.lineTo(18, 4);
  ctx.stroke();
  ctx.fillStyle = "#00FF88";
  ctx.beginPath();
  ctx.arc(24, 4, 3, 0, 7.4);
  ctx.fill();
}

function copy(ctx) {
  ctx.lineWidth = 8;
  ctx.strokeStyle = "#FFFFFF";
  ctx.beginPath();
  ctx.roundRect(10, 20, 32, 36, 6);
  ctx.stroke();
  ctx.beginPath();
  ctx.rect(0, 0, 64, 16);
  ctx.rect(46, 0, 18, 64);
  ctx.clip();
  ctx.beginPath();
  ctx.roundRect(22, 8, 32, 36, 6);
  ctx.stroke();
}

function windUp(ctx) {
  const PI = Math.PI;
  ctx.lineWidth = 4.5;
  ctx.strokeStyle = "#000000";
  ctx.beginPath();
  ctx.moveTo(2, 30);
  ctx.lineTo(7, 25);
  ctx.stroke();
  ctx.beginPath();
  
  ctx.arc(9.5, 29.5, 5, 1.25 * PI, 1.875 * PI);
  
  ctx.stroke();
  ctx.beginPath();
  
  ctx.arc(2.5, 22.5, 5, 0.25 * PI, 1.625 * PI, 1);
  
  ctx.stroke();
  ctx.beginPath();
  
  ctx.arc(18, 24, 5, 0.875 * PI, 1.5 * PI, 1);
  
  ctx.stroke();
  ctx.beginPath();
  
  ctx.arc(18, 14, 5, 0.5 * PI, 1 * PI, 0);
  
  ctx.stroke();
  ctx.beginPath();
  
  ctx.arc(8, 14, 5, 0 * PI, 0.625 * PI, 1);
  
  ctx.stroke();
  ctx.beginPath();
  ctx.lineWidth = 2.5;
  
  ctx.ellipse(22.75, 9, 3.5, 8.5, 1.75 * PI, 0.8 * PI, 0.95 * PI, 1);
  
  ctx.moveTo(17, 12.75);
  ctx.lineTo(21.75, 12.75);
  ctx.lineTo(21.75, 8);
  
  ctx.stroke();
}

function menu(ctx) {
  ctx.beginPath();
  ctx.moveTo(2, 8);
  ctx.lineTo(30, 8);
  ctx.moveTo(2, 16);
  ctx.lineTo(30, 16);
  ctx.moveTo(2, 24);
  ctx.lineTo(30, 24);
  ctx.lineWidth = 4;
  ctx.strokeStyle = "#EEEEFF";
  ctx.stroke();
}

function cross(ctx) {
  ctx.beginPath();
  ctx.moveTo(4, 4);
  ctx.lineTo(28, 28);
  ctx.moveTo(28, 4);
  ctx.lineTo(4, 28);
  ctx.lineWidth = 6;
  ctx.strokeStyle = "#AA0000";
  ctx.stroke();
}

function gear(ctx) {
  const a = 0.25, b = 11.5,
      c = 0.12, d = 15;
  
  ctx.beginPath();
  ctx.moveTo(16 + Math.cos( - a) * b,
      16 + Math.sin( - a) * b);
  for (let i = 0; i < 8; i++) {
    ctx.lineTo(16 + Math.cos(i * Math.PI / 4 - a) * b,
        16 + Math.sin(i * Math.PI / 4 - a) * b);
    ctx.lineTo(16 + Math.cos(i * Math.PI / 4 - c) * d,
        16 + Math.sin(i * Math.PI / 4 - c) * d);
    ctx.lineTo(16 + Math.cos(i * Math.PI / 4 + c) * d,
        16 + Math.sin(i * Math.PI / 4 + c) * d);
    ctx.lineTo(16 + Math.cos(i * Math.PI / 4 + a) * b,
        16 + Math.sin(i * Math.PI / 4 + a) * b);
  }
  ctx.lineTo(16 + Math.cos( - a) * b,
      16 + Math.sin( - a) * b);
  ctx.fillStyle = "#000000";
  ctx.fill();
  
  const r = 5;
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.arc(16, 16, r, 0, 2 * Math.PI);
  ctx.clip();
  ctx.clearRect(0, 0, 32, 32);
}
    </script>
  </head>
